<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Angka 7 - Game Belajar TK</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & Fredoka untuk kesan ramah anak -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Fredoka', 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #a8edd9 0%, #fed6e3 100%);
            touch-action: manipulation;
        }
        .bouncy-hover:hover {
            transform: scale(1.08) rotate(-2deg);
        }
        .bouncy-hover:active {
            transform: scale(0.95);
        }
        .floating {
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-10px) rotate(3deg); }
        }
        .star-glow {
            filter: drop-shadow(0px 0px 8px #facc15);
        }
        .cert-border {
            border: 8px dashed #f59e0b;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 md:p-6 text-slate-800 selection:bg-pink-300">

    <!-- Container Utama App -->
    <div id="app" class="w-full max-w-2xl bg-white/90 backdrop-blur-md rounded-3xl shadow-2xl border-4 border-white overflow-hidden relative min-h-[620px] flex flex-col justify-between">
        
        <!-- Header / Bar Atas -->
        <header class="bg-amber-400 p-4 text-white flex justify-between items-center shadow-md relative z-10">
            <div class="flex items-center gap-2">
                <svg class="w-9 h-9 fill-current text-white floating" viewBox="0 0 100 100">
                    <path d="M 20 20 L 80 20 L 50 85 C 48 88 42 88 40 85 L 35 70 C 35 70 50 38 52 35 C 53 32 50 32 45 32 L 20 32 Z" fill="#FF5722"/>
                    <circle cx="35" cy="27" r="4" fill="#000"/>
                    <circle cx="65" cy="27" r="4" fill="#000"/>
                    <path d="M 45 31 Q 50 36 55 31" stroke="#000" stroke-width="2" fill="none"/>
                </svg>
                <h1 class="text-xl md:text-2xl font-bold tracking-wide drop-shadow text-amber-950">Petualangan Angka 7</h1>
            </div>
            <button id="soundToggle" onclick="toggleAudio()" class="bg-amber-500 hover:bg-amber-600 text-amber-950 p-2 rounded-full transition shadow flex items-center justify-center w-10 h-10">
                <span id="soundIcon" class="text-xl">🔊</span>
            </button>
        </header>

        <!-- Main Dynamic Screen Area -->
        <main id="screenArea" class="p-4 md:p-6 flex-grow flex flex-col justify-center items-center relative">
            <!-- Screen content renders dynamically via JavaScript -->
        </main>

        <!-- Footer / Navigasi Tahap -->
        <footer class="bg-slate-100 p-3 border-t border-slate-200 flex justify-around items-center text-xs md:text-sm font-semibold text-slate-500">
            <div id="step1Indicator" class="flex items-center gap-1 text-amber-600 font-bold">
                <span class="w-6 h-6 rounded-full bg-amber-400 text-white flex items-center justify-center text-xs">1</span> Belajar & Hitung
            </div>
            <div id="step2Indicator" class="flex items-center gap-1 opacity-50">
                <span class="w-6 h-6 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-xs">2</span> Tracing 7
            </div>
            <div id="step3Indicator" class="flex items-center gap-1 opacity-50">
                <span class="w-6 h-6 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-xs">3</span> Sertifikat
            </div>
        </footer>
    </div>

    <!-- JavaScript Logic & Audio Web API -->
    <script>
        // App State
        let soundEnabled = true;
        let currentStep = 1;
        let collectedCount = 0;
        let childName = "";

        // Web Audio Synthesizer (No external MP3 files needed!)
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioCtx();
            }
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'pop') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
                osc.start(now);
                osc.stop(now + 0.1);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now); // C5
                osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                osc.start(now);
                osc.stop(now + 0.5);
            } else if (type === 'count') {
                const pitch = 300 + (collectedCount * 60);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(pitch, now);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').innerText = soundEnabled ? '🔊' : '🔇';
        }

        // SVGs Asset Generators
        const SVGAssets = {
            sevenCharacter: `
                <svg class="w-28 h-28 floating drop-shadow-md" viewBox="0 0 100 100">
                    <path d="M 20 20 L 80 20 L 50 88 C 48 91 42 91 40 88 L 35 75 C 35 75 50 40 52 35 L 20 35 Z" fill="#3B82F6"/>
                    <!-- Mata -->
                    <circle cx="38" cy="27" r="5" fill="#FFF"/>
                    <circle cx="39" cy="27" r="2.5" fill="#000"/>
                    <circle cx="62" cy="27" r="5" fill="#FFF"/>
                    <circle cx="63" cy="27" r="2.5" fill="#000"/>
                    <!-- Pipil lucu -->
                    <circle cx="32" cy="31" r="3" fill="#F472B6" opacity="0.6"/>
                    <circle cx="68" cy="31" r="3" fill="#F472B6" opacity="0.6"/>
                    <!-- Senyum -->
                    <path d="M 45 32 Q 50 37 55 32" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                    <!-- Topi Mahkota -->
                    <polygon points="40,18 50,8 60,18 68,12 62,20 38,20 32,12" fill="#FBBF24"/>
                </svg>
            `,
            items: [
                { name: 'Apel', svg: `<svg class="w-12 h-12" viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="#EF4444"/><path d="M 50 20 C 50 5, 60 10, 65 5" stroke="#78350F" stroke-width="5" fill="none"/><path d="M 50 20 Q 30 15 35 30 Z" fill="#22C55E"/><circle cx="40" cy="45" r="3" fill="#FFF" opacity="0.5"/></svg>` },
                { name: 'Bintang', svg: `<svg class="w-12 h-12" viewBox="0 0 100 100"><polygon points="50,10 63,38 93,38 68,58 78,88 50,70 22,88 32,58 7,38 37,38" fill="#FACC15"/><circle cx="45" cy="42" r="3" fill="#000"/><circle cx="55" cy="42" r="3" fill="#000"/><path d="M 46 50 Q 50 54 54 50" stroke="#000" stroke-width="2" fill="none"/></svg>` },
                { name: 'Balon', svg: `<svg class="w-12 h-12" viewBox="0 0 100 100"><ellipse cx="50" cy="45" rx="30" ry="38" fill="#EC4899"/><polygon points="50,83 45,88 55,88" fill="#DB2777"/><path d="M 50 88 Q 45 95 50 100" stroke="#94A3B8" stroke-width="2" fill="none"/><ellipse cx="38" cy="30" rx="5" ry="10" fill="#FFF" opacity="0.4"/></svg>` },
                { name: 'Kue', svg: `<svg class="w-12 h-12" viewBox="0 0 100 100"><rect x="20" y="50" width="60" height="35" rx="5" fill="#8B5CF6"/><rect x="15" y="40" width="70" height="15" rx="5" fill="#F472B6"/><rect x="47" y="15" width="6" height="25" fill="#FACC15"/><polygon points="50,5 46,15 54,15" fill="#EF4444"/></svg>` },
                { name: 'Mobil', svg: `<svg class="w-12 h-12" viewBox="0 0 100 100"><path d="M 15 55 L 25 35 L 70 35 L 85 55 Z" fill="#10B981"/><rect x="10" y="50" width="80" height="20" rx="5" fill="#059669"/><circle cx="30" cy="70" r="10" fill="#1E293B"/><circle cx="30" cy="70" r="4" fill="#94A3B8"/><circle cx="70" cy="70" r="10" fill="#1E293B"/><circle cx="70" cy="70" r="4" fill="#94A3B8"/></svg>` },
                { name: 'Jeruk', svg: `<svg class="w-12 h-12" viewBox="0 0 100 100"><circle cx="50" cy="55" r="35" fill="#F97316"/><path d="M 50 20 Q 60 10 65 15 Z" fill="#15803D"/><circle cx="42" cy="45" r="2.5" fill="#FFF" opacity="0.6"/></svg>` },
                { name: 'Bunga', svg: `<svg class="w-12 h-12" viewBox="0 0 100 100"><circle cx="50" cy="30" r="15" fill="#F43F5E"/><circle cx="70" cy="50" r="15" fill="#F43F5E"/><circle cx="50" cy="70" r="15" fill="#F43F5E"/><circle cx="30" cy="50" r="15" fill="#F43F5E"/><circle cx="50" cy="50" r="14" fill="#FACC15"/></svg>` }
            ]
        };

        // Navigation UI Indicator Updater
        function updateStepIndicators(step) {
            currentStep = step;
            for (let i = 1; i <= 3; i++) {
                const el = document.getElementById(`step${i}Indicator`);
                if (i === step) {
                    el.className = "flex items-center gap-1 text-amber-600 font-bold opacity-100";
                    el.children[0].className = "w-6 h-6 rounded-full bg-amber-400 text-white flex items-center justify-center text-xs shadow";
                } else {
                    el.className = "flex items-center gap-1 text-slate-400 opacity-60";
                    el.children[0].className = "w-6 h-6 rounded-full bg-slate-300 text-slate-600 flex items-center justify-center text-xs";
                }
            }
        }

        // -------------------------------------------------------------
        // TAHAP 1: Misi Mengumpulkan 7 Benda
        // -------------------------------------------------------------
        function renderStep1() {
            updateStepIndicators(1);
            collectedCount = 0;
            const container = document.getElementById('screenArea');
            
            container.innerHTML = `
                <div class="text-center w-full flex flex-col items-center">
                    <div class="flex items-center justify-center gap-3 mb-2">
                        ${SVGAssets.sevenCharacter}
                        <div class="bg-amber-100 border-2 border-amber-300 p-3 rounded-2xl relative shadow-sm max-w-xs text-left">
                            <p class="text-amber-900 font-bold text-sm md:text-base">Halo! Aku Si Angka 7. BANTU AKU mengumpulkan 7 Benda Ajaib ke Keranjang ya!</p>
                        </div>
                    </div>

                    <!-- Progress Keranjang Slot -->
                    <div class="bg-amber-50 border-2 border-amber-200 rounded-2xl p-3 w-full max-w-md my-3 shadow-inner">
                        <div class="flex justify-between items-center mb-2 px-1">
                            <span class="text-xs md:text-sm font-bold text-amber-800">Keranjang Ajaib:</span>
                            <span id="countBadge" class="bg-amber-500 text-white px-3 py-0.5 rounded-full text-xs font-extrabold shadow">0 / 7</span>
                        </div>
                        <div id="slotsGrid" class="grid grid-cols-7 gap-1.5 md:gap-2">
                            ${Array(7).fill(0).map((_, i) => `
                                <div id="slot-${i}" class="h-10 md:h-12 border-2 border-dashed border-amber-300 rounded-xl flex items-center justify-center bg-white transition-all">
                                    <span class="text-amber-200 font-bold text-xs">${i+1}</span>
                                </div>
                            `).join('')}
                        </div>
                    </div>

                    <!-- Pilihan Benda untuk Diklik -->
                    <p class="text-xs text-slate-500 font-medium mb-2">Klik benda-benda lucu di bawah ini:</p>
                    <div id="itemsContainer" class="flex flex-wrap justify-center gap-2 md:gap-3 max-w-md">
                        ${SVGAssets.items.map((item, idx) => `
                            <button onclick="collectItem(${idx})" id="itemBtn-${idx}" class="bouncy-hover bg-white p-2 md:p-3 rounded-2xl shadow-md border-2 border-slate-100 transition-all flex flex-col items-center cursor-pointer">
                                ${item.svg}
                                <span class="text-[10px] font-bold text-slate-600 mt-1">${item.name}</span>
                            </button>
                        `).join('')}
                    </div>

                    <!-- Tombol Lanjut (Tersembunyi hingga selesai) -->
                    <button id="nextStepBtn" onclick="renderStep2()" class="hidden mt-4 bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-8 py-3 rounded-2xl text-lg shadow-lg bouncy-hover flex items-center gap-2">
                        <span>Hebat! Lanjut Tracing</span>
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"/></svg>
                    </button>
                </div>
            `;
        }

        function collectItem(idx) {
            if (collectedCount >= 7) return;

            const btn = document.getElementById(`itemBtn-${idx}`);
            if (btn.classList.contains('opacity-30')) return; // sudah diambil

            // Effect Suara
            collectedCount++;
            playSound('count');

            // Visual disable button
            btn.classList.add('opacity-30', 'pointer-events-none', 'scale-90');

            // Masukkan ke slot keranjang
            const slot = document.getElementById(`slot-${collectedCount - 1}`);
            slot.innerHTML = SVGAssets.items[idx].svg;
            slot.classList.remove('border-dashed', 'border-amber-300');
            slot.classList.add('border-solid', 'border-emerald-400', 'bg-emerald-50', 'scale-105');

            // Update counter badge
            document.getElementById('countBadge').innerText = `${collectedCount} / 7`;

            // Cek jika sudah selesai 7
            if (collectedCount === 7) {
                playSound('success');
                setTimeout(() => {
                    confetti({ particleCount: 50, spread: 60, origin: { y: 0.7 } });
                    document.getElementById('nextStepBtn').classList.remove('hidden');
                }, 300);
            }
        }

        // -------------------------------------------------------------
        // TAHAP 2: Tracing Canvas Angka 7
        // -------------------------------------------------------------
        let isDrawing = false;
        let traceProgress = 0;

        function renderStep2() {
            updateStepIndicators(2);
            playSound('pop');

            const container = document.getElementById('screenArea');
            container.innerHTML = `
                <div class="text-center w-full flex flex-col items-center">
                    <h2 class="text-lg md:text-xl font-bold text-amber-900 mb-1">Ayo Tebalkan Garis Angka 7!</h2>
                    <p class="text-xs text-slate-500 mb-3">Tarik garis dari kiri atas ke kanan, lalu miring ke bawah</p>

                    <div class="relative bg-white rounded-3xl p-2 shadow-inner border-4 border-amber-200">
                        <canvas id="tracingCanvas" width="280" height="280" class="cursor-crosshair touch-none rounded-2xl bg-amber-50/50"></canvas>
                    </div>

                    <div class="flex gap-3 mt-4">
                        <button onclick="resetCanvas()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-sm transition">
                            🔄 Ulangi
                        </button>
                        <button id="finishTraceBtn" onclick="renderStep3()" class="bg-amber-500 hover:bg-amber-600 text-white font-extrabold px-6 py-2 rounded-xl text-sm shadow bouncy-hover">
                            Selesai ✨
                        </button>
                    </div>
                </div>
            `;

            initTracingCanvas();
        }

        function initTracingCanvas() {
            const canvas = document.getElementById('tracingCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');

            drawGuideLines(ctx);

            // Pointer event handlers (mouse & touch)
            const getPos = (e) => {
                const rect = canvas.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return {
                    x: clientX - rect.left,
                    y: clientY - rect.top
                };
            };

            const startDrawing = (e) => {
                isDrawing = true;
                const pos = getPos(e);
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                playSound('pop');
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                ctx.lineTo(pos.x, pos.y);
                ctx.strokeStyle = '#3B82F6';
                ctx.lineWidth = 16;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();
            };

            const stopDrawing = () => {
                isDrawing = false;
            };

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            window.addEventListener('mouseup', stopDrawing);

            canvas.addEventListener('touchstart', startDrawing, { passive: false });
            canvas.addEventListener('touchmove', draw, { passive: false });
            window.addEventListener('touchend', stopDrawing);
        }

        function drawGuideLines(ctx) {
            ctx.clearRect(0, 0, 280, 280);

            // Draw dotted guide for number 7
            ctx.beginPath();
            ctx.strokeStyle = '#CBD5E1';
            ctx.lineWidth = 10;
            ctx.lineCap = 'round';
            ctx.setLineDash([8, 12]);

            // Top Horizontal Line: (50,60) -> (230,60)
            ctx.moveTo(50, 60);
            ctx.lineTo(230, 60);

            // Diagonal Line down: (230,60) -> (110,240)
            ctx.lineTo(110, 240);
            ctx.stroke();

            ctx.setLineDash([]); // Reset dash

            // Draw start dot
            ctx.fillStyle = '#EF4444';
            ctx.beginPath();
            ctx.arc(50, 60, 8, 0, Math.PI * 2);
            ctx.fill();
        }

        function resetCanvas() {
            playSound('pop');
            const canvas = document.getElementById('tracingCanvas');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                drawGuideLines(ctx);
            }
        }

        // -------------------------------------------------------------
        // TAHAP 3: Layar Selamat & Sertifikat Digital
        // -------------------------------------------------------------
        function renderStep3() {
            updateStepIndicators(3);
            playSound('success');

            // Trigger Fireworks / Confetti
            launchFireworks();

            const container = document.getElementById('screenArea');
            container.innerHTML = `
                <div class="text-center w-full flex flex-col items-center">
                    
                    <!-- Sertifikat Box -->
                    <div id="certificateCard" class="cert-border bg-amber-50/90 rounded-3xl p-4 md:p-6 w-full max-w-lg shadow-xl relative overflow-hidden my-1">
                        <!-- Hiasan Bintang Emas Corner -->
                        <span class="absolute top-2 left-2 text-2xl star-glow">⭐</span>
                        <span class="absolute top-2 right-2 text-2xl star-glow">⭐</span>
                        <span class="absolute bottom-2 left-2 text-2xl star-glow">⭐</span>
                        <span class="absolute bottom-2 right-2 text-2xl star-glow">⭐</span>

                        <h2 class="text-xl md:text-2xl font-black text-amber-700 tracking-wide uppercase mb-1">
                            🏆 SERTIFIKAT HEBAT 🏆
                        </h2>
                        
                        <!-- Pesan Teks Utama Sesuai Permintaan -->
                        <p class="text-xs md:text-sm text-slate-700 font-bold mb-1">
                            Selamat, kamu berhasil menyelesaikan misi petualangan angka 7.
                        </p>
                        <p class="text-sm md:text-base font-extrabold text-emerald-600 mb-3 italic">
                            Baarakallahu fiik. ✨
                        </p>

                        <!-- Input Nama Anak -->
                        <div class="my-3 bg-white p-3 rounded-2xl shadow-inner border border-amber-200">
                            <label class="block text-xs font-bold text-amber-800 mb-1">Tulis Nama Kamu di Sini:</label>
                            <input type="text" id="nameInput" placeholder="Ketik Nama Anak..." value="${childName}" 
                                oninput="updateNameDisplay(this.value)"
                                class="w-full text-center font-bold text-lg text-amber-900 bg-amber-50 border-2 border-amber-300 rounded-xl py-1.5 focus:outline-none focus:border-amber-500">
                        </div>

                        <!-- Tampilan Nama di Sertifikat -->
                        <div class="mt-2">
                            <span class="text-xs text-slate-400 block">Diberikan Kepada Bintang Cilik:</span>
                            <h3 id="displayName" class="text-2xl md:text-3xl font-black text-blue-600 underline decoration-wavy decoration-amber-400 min-h-[36px]">
                                ${childName || 'Anak Hebat'}
                            </h3>
                        </div>

                        <!-- Karakter Mini 7 -->
                        <div class="flex justify-center mt-2">
                            ${SVGAssets.sevenCharacter}
                        </div>
                    </div>

                    <!-- Tombol Aksi -->
                    <div class="flex flex-wrap justify-center gap-3 mt-3">
                        <button onclick="printCertificate()" class="bg-amber-500 hover:bg-amber-600 text-white font-extrabold px-5 py-2.5 rounded-2xl text-sm shadow-md bouncy-hover flex items-center gap-1.5">
                            🖨️ Cetak / Simpan
                        </button>
                        <button onclick="renderStep1()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-extrabold px-5 py-2.5 rounded-2xl text-sm shadow-md bouncy-hover flex items-center gap-1.5">
                            🔄 Main Lagi
                        </button>
                    </div>
                </div>
            `;
        }

        function updateNameDisplay(val) {
            childName = val;
            const display = document.getElementById('displayName');
            if (display) {
                display.innerText = val.trim() !== "" ? val : "Anak Hebat";
            }
        }

        function launchFireworks() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            var interval = setInterval(function() {
                var timeLeft = animationEnd - Date.now();

                if (timeLeft <= 0) {
                    return clearInterval(interval);
                }

                var particleCount = 50 * (timeLeft / duration);
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
                confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function randomInRange(min, max) {
            return Math.random() * (max - min) + min;
        }

        function printCertificate() {
            playSound('pop');
            window.print();
        }

        // Initialize game on load
        window.onload = function() {
            renderStep1();
        };
    </script>
</body>
</html>
